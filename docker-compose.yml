version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-autexa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-service:
    build: ./services/agent-service
    ports:
      - "8000:8000"
    volumes:
      - ./services/agent-service:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-autexa}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  channels-service:
    build: ./services/channels-service
    ports:
      - "8001:8001"
    volumes:
      - ./services/channels-service:/app
    environment:
      - AGENT_SERVICE_URL=http://agent-service:8000
    depends_on:
      - agent-service

volumes:
  postgres_data:
